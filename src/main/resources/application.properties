# Application diagnostics
logging.level.de.ddb.labs.zdbdump=${ZDBDUMP_LOG_LEVEL:INFO}

# HTTP listener and servlet context path
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=128
server.port=${ZDBDUMP_PORT:8080}
server.servlet.context-path=${ZDBDUMP_PATH_PREFIX:/}

# Public health status for the container probe
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Set both credentials to enable the manual POST trigger.
spring.security.user.name=${ZDBDUMP_SECURITY_USER:}
spring.security.user.password=${ZDBDUMP_SECURITY_PASSWORD:}

# Public address used to construct download links. The controller appends the context path.
zdbdump.baseurl=${ZDBDUMP_BASEURL:http://localhost:8080}

# Spring cron expression with seconds as the first field. The default is 04:00 in the scheduler's timezone.
zdbdump.cron.job=${ZDBDUMP_CRON_JOB:0 0 4 * * *}

# Published dumps live in the output directory. The temp directory holds the upstream cache and the MVStore
# database when the database path is relative.
zdbdump.database=${ZDBDUMP_DATABASE:zdbdump_DO_NOT_DELETE_ITS_IMPORTANT.db}
zdbdump.output.filename=${ZDBDUMP_OUTPUT_FILENAME:zdb_lds.rdf.gz}
zdbdump.path.output=${ZDBDUMP_PATH_OUTPUT:data/}
zdbdump.path.temp=${ZDBDUMP_PATH_TEMP:data/tmp/}
